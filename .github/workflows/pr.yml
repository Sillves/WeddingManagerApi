name: PR Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore WeddingManagerApi.sln

      - name: Build
        run: dotnet build WeddingManagerApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WeddingManager.Tests/WeddingManager.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory WeddingManager.Tests/TestResults

      - name: Generate coverage summary
        run: |
          dotnet tool install --tool-path ./.tools dotnet-reportgenerator-globaltool
          ./.tools/reportgenerator \
            -reports:"WeddingManager.Tests/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"WeddingManager.Tests/TestResults/coverage-summary" \
            -reporttypes:TextSummary
          cat WeddingManager.Tests/TestResults/coverage-summary/Summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage summary
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'WeddingManager.Tests/TestResults/coverage-summary/Summary.txt';
            if (!fs.existsSync(path)) {
              core.warning(`Coverage summary not found at ${path}`);
              return;
            }
            const summary = fs.readFileSync(path, 'utf8').trim();
            const marker = '<!-- coverage-summary -->';
            const body = `${marker}\n### Coverage Summary\n\n\`\`\`\n${summary}\n\`\`\``;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: WeddingManager.Tests/TestResults
