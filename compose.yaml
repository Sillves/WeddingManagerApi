version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: amare-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amare
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: amare-smtp4dev
    ports:
      - "3000:80"
      - "2525:25"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: amare-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/amare-media;
      mc anonymous set download local/amare-media;
      exit 0;
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data: